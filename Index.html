<!DOCTYPE html>
<html class="w-screen h-screen left-0 top-0 overflow-hidden">

<head>
    <title>Portfolio Hedin</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet">
    <link rel="stylesheet" href="output.css">
</head>

<script src="rotator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>

<body class="min-h-screen bg-gradient-to-br from-yellow-500 from-5% via-green-500 via-30% bg-gray-800">

    <!-- Navbar -->
    <div class="relative h-screen w-screen">
        <div class="relative z-20 w-[600px] flex items-center justify-center">
            <div
                class="bg-gray-800 absolute -top-60 -left-40 w-[600px] h-[600px] rounded-full flex items-center justify-center">
                <h1 class="text-8xl p-3 absolute top-57 left-40 text-white font-bold">Portfolio Hedin Seinen</h1>
            </div>
        </div>
        <div class="flex items-center justify-end w-full bg-gray-800 p-4 text-white">
            <div class="flex items-center gap-4">
                <h1>Email:</h1>
                <img src="email.png" alt="Email" class="w-70 h-10 object-cover">
                <h1>Phone:</h1>
                <img src="phone.png" alt="Phone" class="w-50 h-10 object-cover">
            </div>
        </div>
        <nav class="absolute z-10 top-0 flex flex-col h-full">
            <ul class="gap-22 pb-8 bg-gray-800 text-white h-full flex flex-1 flex-col justify-end p-5 items-center">
                <li
                    class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
                    <a href="index.html">Home</a>
                </li>
                <li
                    class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
                    <a href="about.html">About</a>
                </li>
                <li
                    class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
                    <a href="projects.html">Projects</a>
                </li>
                <li
                    class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
                    <a href="Contact.html">Contact</a>
                </li>
            </ul>
        </nav>

        <div class="absolute flex justify-center w-full ">
            <div id="default-carousel" class="bg-red-800 relative " data-carousel="slide">
                <!-- Carousel wrapper -->
                <div class="relative rounded-lg md:h-96">
                    <!-- Item 1 -->
                    <div class="hidden bg-gray-800 duration-9000 ease-in-out" data-carousel-item>
                        <h3 class="flex text-white justify-center font-bold drop-shadow-lg text-2xl space-x-4 p-1">
                            Home Page</h3>
                            <p class="flex justify-center space-x-4 p-1">${items[index].text}</p>
                            <div class="flex justify-center">
                            <img src="home.jpg" class="absolute block aspect-square object-cover w-400 p-3 rounded-xl mt-3"
                                alt="...">
                        </div>
                        <div class="flex justify-center p-5">
                            <a href="${items[index].href}" id="learn-more-link"
                                class="btn btn-primary flex justify-center items-center p-2 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out rounded-2xl w-32 hover:w-40">Learn
                                More</a>
                        </div>
                    </div>
                    <!-- Item 2 -->
                    <div class="hidden bg-gray-800 duration-9000 ease-in-out" data-carousel-item>
                        <h3 class="flex justify-center font-bold drop-shadow-lg text-2xl space-x-4 p-1">
                            ${items[index].title}</h3>
                            <p class="flex justify-center space-x-4 p-1">${items[index].text}</p>
                            <div class="flex justify-center">
                            <img src="about.jpg" class="absolute block aspect-square object-cover w-400 p-3 rounded-xl mt-3"
                                alt="...">
                        </div>
                        <div class="flex justify-center p-5">
                            <a href="${items[index].href}" id="learn-more-link"
                                class="btn btn-primary flex justify-center items-center p-2 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out rounded-2xl w-32 hover:w-40">Learn
                                More</a>
                        </div>
                    </div>
                    <!-- Item 3 -->
                    <div class="hidden bg-gray-800 duration-9000 ease-in-out" data-carousel-item>
                        <h3 class="flex justify-center font-bold drop-shadow-lg text-2xl space-x-4 p-1">
                            ${items[index].title}</h3>
                            <p class="flex justify-center space-x-4 p-1">${items[index].text}</p>
                            <div class="flex justify-center">
                            <img src="projects.jpg"
                                class="absolute block aspect-square object-cover w-400 p-3 rounded-xl mt-3" alt="...">
                        </div>
                        <div class="flex justify-center p-5">
                            <a href="${items[index].href}" id="learn-more-link"
                                class="btn btn-primary flex justify-center items-center p-2 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out rounded-2xl w-32 hover:w-40">Learn
                                More</a>
                        </div>
                    </div>
                    <!-- Item 4 -->
                    <div class="hidden bg-gray-800 duration-9000 ease-in-out" data-carousel-item>
                        <h3 class="flex justify-center font-bold drop-shadow-lg text-2xl space-x-4 p-1">
                            ${items[index].title}</h3>
                            <p class="flex justify-center space-x-4 p-1">${items[index].text}</p>
                            <div class="flex justify-center">
                            <img src="contact.jpg"
                                class="absolute block aspect-square object-cover w-400 p-3 rounded-xl mt-3" alt="...">
                        </div>
                        <div class="flex justify-center p-5">
                            <a href="${items[index].href}" id="learn-more-link"
                                class="btn btn-primary flex justify-center items-center p-2 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out rounded-2xl w-32 hover:w-40">Learn
                                More</a>
                        </div>
                    </div>

                </div>
                <!-- Slider indicators -->
                <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="true" aria-label="Slide 1"
                        data-carousel-slide-to="0"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 2"
                        data-carousel-slide-to="1"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 3"
                        data-carousel-slide-to="2"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 4"
                        data-carousel-slide-to="3"></button>
                </div>
                <!-- Slider controls -->
                <button type="button"
                    class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    data-carousel-prev>
                    <span
                        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                        <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 1 1 5l4 4" />
                        </svg>
                        <span class="sr-only">Previous</span>
                    </span>
                </button>
                <button type="button"
                    class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    data-carousel-next>
                    <span
                        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                        <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 9 4-4-4-4" />
                        </svg>
                        <span class="sr-only">Next</span>
                    </span>
                </button>
            </div>
        </div>

        <!-- buttons -->
        <!-- <div class="flex justify-center size-full inset-0">
            <div
                class="absolute flex justify-center gap-6 w-130 bg-gray-800 p-4 inset-x-0 bottom-0 rounded-full shadow-lg z-10">
                <button id="rotator-prev"
                    class="px-4 z-10 py-2 rounded-full  text-white w-32 hover:w-40 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out">Prev</button>
                <button id="rotator-pause"
                    class="px-4 z-10 py-2 rounded-full text-white w-32 hover:w-40 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out">Pause</button>
                <button id="rotator-next"
                    class="px-4 z-10 py-2 rounded-full text-white w-32 hover:w-40 bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out">Next</button>
            </div>
        </div> -->
    </div>


</body>

</html>
