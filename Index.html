<!DOCTYPE html>
<html>
  <head>
    <title>Portfolio Hedin</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="output.css" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>
  </head>

  <body class="min-h-screen w-screen bg-gradient-to-br from-yellow-500 from-5% via-green-500 via-30% bg-gray-800">
    <!-- Navbar -->
    <div class="w-full h-20  bg-gray-800 p-4 text-white">
      <div class="relative flex items-center justify-center">
        <div
          class="bg-gray-800 absolute -top-60 -left-40 w-[600px] h-[600px] rounded-full flex items-center justify-center">
          <h1 class="text-8xl p-3 absolute top-57 left-40 text-white font-bold">Portfolio Hedin Seinen</h1>
        </div>
      </div>
      <div class="flex items-center justify-end w-full">
        <div class="flex items-center gap-4">
          <h1>Email:</h1>
          <img src="email.png" alt="Email" class="w-70 h-10 object-cover" />
          <h1>Phone:</h1>
          <img src="phone.png" alt="Phone" class="w-50 h-10 object-cover" />
        </div>
      </div>
    </div>

    <main class="flex min-h-[calc(100vh-5rem)] ">

      <!--- Side nav -->
      <div class="flex-none">
        <nav class="flex flex-col h-full">
          <ul class="gap-22 pb-8 bg-gray-800 text-white h-full flex flex-1 flex-col justify-end p-5 items-center">
            <li
              class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
              <a href="index.html">Home</a>
            </li>
            <li
              class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
              <a href="about.html">About</a>
            </li>
            <li
              class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
              <a href="projects.html">Projects</a>
            </li>
            <li
              class="bg-green-700 hover:bg-green-800 hover:text-xl transition-all duration-300 ease-in-out px-6 p-3 rounded-2xl text-center w-32 hover:w-40">
              <a href="Contact.html">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

    <!-- Content -->
      <div class="flex justify-center w-full h-full border border-2 border-red-500 pl-96">
        <div id="default-carousel" class="relative w-full" data-carousel="slide">
          <!-- Carousel wrapper -->
          <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
            <!-- Item 1 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                     <p class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">Dit is een text</p>
            </div>
            <!-- Item 2 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                     <p class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">Dit is een text 2</p>
            </div>
            <!-- Item 3 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
          <p class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">Dit is een text 3</p>
            </div>
            <!-- Item 4 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                    <p class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">Dit is een text 4</p>
            </div>
            <!-- Item 5 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <p class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">Dit is een text 5</p>
            </div>
          </div>
          <!-- Slider indicators -->
          <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
            <button
              type="button"
              class="w-3 h-3 rounded-full"
              aria-current="true"
              aria-label="Slide 1"
              data-carousel-slide-to="0"></button>
            <button
              type="button"
              class="w-3 h-3 rounded-full"
              aria-current="false"
              aria-label="Slide 2"
              data-carousel-slide-to="1"></button>
            <button
              type="button"
              class="w-3 h-3 rounded-full"
              aria-current="false"
              aria-label="Slide 3"
              data-carousel-slide-to="2"></button>
            <button
              type="button"
              class="w-3 h-3 rounded-full"
              aria-current="false"
              aria-label="Slide 4"
              data-carousel-slide-to="3"></button>
            <button
              type="button"
              class="w-3 h-3 rounded-full"
              aria-current="false"
              aria-label="Slide 5"
              data-carousel-slide-to="4"></button>
          </div>
          <!-- Slider controls -->
          <button
            type="button"
            class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
            data-carousel-prev>
            <span
              class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
              <svg
                class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 6 10">
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 1 1 5l4 4" />
              </svg>
              <span class="sr-only">Previous</span>
            </span>
          </button>
          <button
            type="button"
            class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
            data-carousel-next>
            <span
              class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
              <svg
                class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 6 10">
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m1 9 4-4-4-4" />
              </svg>
              <span class="sr-only">Next</span>
            </span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
